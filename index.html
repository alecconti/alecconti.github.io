<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>J. Alec Conti · Bookshelf</title>
  <meta name="description" content="J. Alec Conti’s bookshelf: internships and projects bound as books, plus notebooks of what he is learning, pulled live from Lexicon.">
  <meta name="theme-color" content="#efebe3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='6' height='24' rx='1' fill='%2322379a'/%3E%3Crect x='13' y='7' width='5' height='21' rx='1' fill='%23b4532a'/%3E%3Crect x='19' y='5' width='7' height='23' rx='1' fill='%232f4a3a'/%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <a class="name" href="#" aria-label="J. Alec Conti, home">J. Alec Conti</a>
    <nav class="links">
      <a href="mailto:johnalecconti@gmail.com">Email</a>
      <a href="https://linkedin.com/in/alecconti" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/alecconti" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main>
    <h1 class="sr-only">J. Alec Conti’s bookshelf</h1>
    <section class="intro">
      <p>Work, bound as books. Notebooks of what I’m learning, printed live from <a href="https://lexicon-dusky-kappa.vercel.app" target="_blank" rel="noopener">Lexicon</a>.</p>
      <p id="live-status" class="status" role="status">Setting the shelf…</p>
    </section>

    <div id="stage" aria-hidden="true">
      <div id="labels"></div>
    </div>

    <nav id="book-list" aria-label="Books on the shelf"></nav>

    <div class="shelf-controls">
      <button id="scroll-left" type="button" aria-label="Scroll the shelf left">←</button>
      <p class="hint">Scroll or drag to browse · Click a book to read it</p>
      <button id="scroll-right" type="button" aria-label="Scroll the shelf right">→</button>
    </div>
    <p id="caption" aria-hidden="true"></p>
  </main>

  <div id="reader" hidden role="dialog" aria-label="Open book">
    <div class="spread">
      <div class="page left"></div>
      <div class="page right"></div>
      <div class="leaf" hidden><div class="face front page"></div><div class="face back page"></div></div>
      <div class="gutter"></div>
    </div>
    <div class="reader-bar">
      <button class="prev" type="button" aria-label="Previous page">←</button>
      <span class="counter" aria-live="polite"></span>
      <button class="next" type="button" aria-label="Next page">→</button>
    </div>
    <button class="close" type="button">Return to shelf <span aria-hidden="true">✕</span></button>
    <div class="measure page" aria-hidden="true"><div class="body text"></div></div>
  </div>

  <noscript><p class="noscript">This shelf needs JavaScript. Reach me at johnalecconti@gmail.com or linkedin.com/in/alecconti.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
